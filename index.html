<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1A1208">
<title>Thalaivaa's – Weekly Roster</title>
<style>
  /* ── DESIGN TOKENS ───────────────────────────────────────────── */
  :root {
    --bg:           #1A1208;
    --bg2:          #231A0C;
    --paper:        #FBF6EC;
    --paper-alt:    #F0E8D4;
    --paper-deep:   #E6D9BF;
    --ink:          #1E1A14;
    --ink-soft:     #7A6F5E;
    --ink-faint:    #B8AE99;
    --line:         #DDD3BA;
    --accent:       #D4882A;
    --accent-light: #F0A940;
    --accent-ink:   #2B1A00;
    --success:      #3D7A5A;
    --warn:         #B84034;
    --warn-ink:     #FBF6EC;
    --rail-ink:     #F5EED8;
    --gold:         #C8962A;
    --shadow-sm:    0 2px 8px rgba(0,0,0,.18);
    --shadow-md:    0 8px 28px rgba(0,0,0,.32);
    --shadow-lg:    0 16px 48px rgba(0,0,0,.42);
    --r-sm:         10px;
    --r-md:         14px;
    --r-lg:         20px;
    --r-xl:         24px;
  }

  /* ── RESET ───────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  button { font: inherit; cursor: pointer; }
  input  { font: inherit; }

  /* ── BASE ────────────────────────────────────────────────────── */
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* ── APP SHELL ───────────────────────────────────────────────── */
  .app {
    max-width: 680px;
    margin: 0 auto;
    min-height: 100dvh;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: var(--shadow-lg);
  }

  /* ── RAIL (header) ───────────────────────────────────────────── */
  .rail {
    background: var(--bg);
    color: var(--rail-ink);
    padding: calc(env(safe-area-inset-top) + 20px) 20px 16px;
    position: sticky;
    top: 0;
    z-index: 30;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .rail-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent-light), var(--gold));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(212,136,42,.4);
  }
  .brand-text {}
  .rail-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: .1px;
    margin: 0;
    line-height: 1.2;
    color: #fff;
  }
  .rail-restaurant {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--accent-light);
    margin: 0;
  }
  .rail-sub {
    font-size: 12px;
    color: #9A9080;
    margin: 2px 0 0;
    display: none; /* shown via JS */
  }
  .rail-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }
  .icon-btn {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.1);
    color: var(--rail-ink);
    border-radius: var(--r-sm);
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background .15s;
  }
  .icon-btn:active { background: rgba(255,255,255,.16); }

  .template-tabs {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .template-tab {
    flex: 1;
    background: transparent;
    border: 1px solid rgba(255,255,255,.12);
    color: #9A9080;
    padding: 9px 6px;
    border-radius: var(--r-sm);
    font-size: 13px;
    font-weight: 700;
    transition: all .18s;
  }
  .template-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  /* ── DAY TABS ────────────────────────────────────────────────── */
  .day-tabs-wrap {
    background: var(--paper);
    padding: 14px 16px 0;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: calc(env(safe-area-inset-top) + 110px);
    z-index: 20;
  }
  .day-tabs {
    display: flex;
    gap: 6px;
  }
  .day-tab {
    flex: 1;
    padding: 10px 4px;
    text-align: center;
    border: none;
    background: var(--paper-alt);
    border-radius: var(--r-sm) var(--r-sm) 0 0;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
    transition: all .15s;
    position: relative;
  }
  .day-tab.active {
    background: var(--paper);
    color: var(--ink);
  }
  .day-tab.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
  }
  .day-tab .day-count {
    display: block;
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    margin-top: 1px;
  }
  .day-tab.active .day-count { color: var(--accent); }

  /* ── BOARD ───────────────────────────────────────────────────── */
  .board {
    flex: 1;
    padding: 4px 16px 120px;
  }

  .group-label {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 24px 0 4px;
    padding-left: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .group-label:first-child { margin-top: 16px; }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 13px 2px;
    border-bottom: 1px dashed var(--line);
    transition: background .12s;
  }
  .row:active { background: var(--paper-alt); border-radius: var(--r-sm); }

  .row-info { min-width: 0; flex: 1; }
  .row-role {
    font-size: 14px;
    font-weight: 700;
    margin: 0;
    line-height: 1.3;
    color: var(--ink);
  }
  .row-time {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin: 2px 0 0;
  }

  .chip {
    border: none;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: transform .1s, opacity .1s;
  }
  .chip:active { transform: scale(.96); opacity: .85; }
  .chip-empty {
    background: transparent;
    border: 1.5px dashed #C0B49A;
    color: var(--ink-soft);
  }
  .chip-off {
    background: transparent;
    color: var(--ink-faint);
    font-size: 11.5px;
    font-weight: 600;
    padding: 8px 6px;
    border: none;
  }
  .chip-name { color: #fff; }
  .chip-x { opacity: .85; font-weight: 900; margin-left: 2px; }

  /* filled count badge on day tab */
  .fill-badge {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 8px;
    font-size: 9.5px;
    font-weight: 800;
    padding: 1px 5px;
    margin-left: 3px;
    vertical-align: middle;
  }

  /* ── FOOTER PULL-TAB ─────────────────────────────────────────── */
  .footer-tab {
    position: sticky;
    bottom: 0;
    left: 0; right: 0;
    background: var(--bg);
    color: var(--rail-ink);
    border: none;
    padding: 16px 20px;
    font-size: 14px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 -8px 24px rgba(0,0,0,.28);
    transition: background .15s;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  .footer-tab:active { background: var(--bg2); }
  .footer-tab-icon {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: var(--accent-ink);
  }

  /* ── OVERLAY + SHEETS ────────────────────────────────────────── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(16,12,6,.6);
    display: none;
    align-items: flex-end;
    z-index: 50;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  .overlay.show { display: flex; }
  .overlay.center { align-items: center; justify-content: center; padding: 20px; }

  .sheet {
    background: var(--paper);
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    border-radius: var(--r-xl) var(--r-xl) 0 0;
    padding: 16px 20px calc(env(safe-area-inset-bottom) + 20px);
    max-height: 84vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    animation: slideUp .22s cubic-bezier(.32,1,.42,1);
  }
  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--line);
    border-radius: 3px;
    margin: 0 auto 16px;
  }
  .sheet-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 4px;
  }
  .sheet-title { font-size: 16px; font-weight: 800; margin: 0; }
  .sheet-sub   { font-size: 12.5px; color: var(--ink-soft); margin: 3px 0 18px; }
  .sheet-close {
    background: var(--paper-alt);
    border: none;
    border-radius: 50%;
    width: 28px; height: 28px;
    font-size: 16px;
    color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .emp-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
  }
  .emp-btn {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px 10px;
    border-radius: var(--r-md);
    border: 1.5px solid var(--line);
    background: var(--paper);
    text-align: left;
    position: relative;
    transition: all .15s;
  }
  .emp-btn:active { transform: scale(.97); }
  .emp-btn.selected {
    border-color: var(--ink);
    background: var(--paper-alt);
  }
  .emp-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
  }
  .emp-btn-name { font-size: 13.5px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conflict-dot {
    position: absolute; top: 6px; right: 6px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--warn);
  }

  .sheet-clear {
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    border-radius: var(--r-sm);
    border: 1.5px solid var(--warn);
    background: transparent;
    color: var(--warn);
    font-weight: 800;
    font-size: 13px;
    transition: background .15s;
  }
  .sheet-clear:active { background: rgba(184,64,52,.08); }
  .conflict-note { font-size: 11.5px; color: var(--warn); margin: 10px 2px 0; display: none; }
  .conflict-note.show { display: block; }

  /* ── OVERVIEW MODAL ──────────────────────────────────────────── */
  .modal {
    background: var(--paper);
    width: 100%;
    max-width: 680px;
    border-radius: var(--r-lg);
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    animation: popIn .2s cubic-bezier(.32,1,.42,1);
  }
  @keyframes popIn {
    from { transform: scale(.96); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .modal-head {
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    position: sticky;
    top: 0;
    background: var(--paper);
    z-index: 2;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
  }
  .modal-title { font-size: 16px; font-weight: 800; margin: 0; }
  .modal-close {
    background: var(--paper-alt);
    border: none;
    border-radius: 50%;
    width: 30px; height: 30px;
    font-size: 18px;
    color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .modal-body { padding: 16px 20px 24px; }

  .week-label-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .week-label-row input {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 10px 12px;
    font-size: 13px;
    background: #fff;
    color: var(--ink);
    outline: none;
    transition: border-color .15s;
  }
  .week-label-row input:focus { border-color: var(--accent); }

  .stats-row {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .stat-card {
    flex: 1;
    min-width: 80px;
    background: var(--paper-alt);
    border-radius: var(--r-md);
    padding: 12px 14px;
    text-align: center;
  }
  .stat-num  { font-size: 22px; font-weight: 800; color: var(--accent); line-height: 1; }
  .stat-lbl  { font-size: 10.5px; color: var(--ink-soft); font-weight: 600; margin-top: 3px; text-transform: uppercase; letter-spacing: .5px; }

  /* overview table */
  table.ov { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.ov th {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--ink-soft);
    text-align: left;
    padding: 6px 4px;
    border-bottom: 2px solid var(--ink);
  }
  table.ov th.day-col { text-align: center; }
  table.ov td {
    padding: 6px 4px;
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    vertical-align: middle;
  }
  table.ov td.role-cell { font-weight: 700; }
  table.ov td .role-time { display: block; font-weight: 400; color: var(--ink-soft); font-size: 10px; }
  table.ov td.day-cell { text-align: center; }
  .pill-mini {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 7px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
  }
  .dash { color: var(--ink-faint); }

  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-soft); }
  .legend-dot  { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  .download-btn {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border-radius: var(--r-md);
    border: none;
    background: linear-gradient(135deg, var(--accent-light), var(--gold));
    color: var(--accent-ink);
    font-weight: 800;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(212,136,42,.35);
    transition: opacity .15s, transform .1s;
  }
  .download-btn:active { opacity: .88; transform: scale(.99); }
  .reset-btn {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border-radius: var(--r-md);
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 12.5px;
    transition: background .15s;
  }
  .reset-btn:active { background: var(--paper-alt); }

  /* ── TEAM PANEL ──────────────────────────────────────────────── */
  .team-list { display: flex; flex-direction: column; gap: 6px; }
  .team-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 6px;
    border-bottom: 1px dashed var(--line);
    border-radius: var(--r-sm);
    transition: background .12s;
  }
  .team-row:active { background: var(--paper-alt); }
  .team-row .emp-dot { width: 32px; height: 32px; font-size: 12px; }
  .team-row-name { flex: 1; font-size: 14px; font-weight: 700; }
  .team-row-shifts { font-size: 11px; color: var(--ink-soft); font-weight: 600; }
  .team-remove {
    background: none;
    border: 1px solid rgba(184,64,52,.3);
    border-radius: var(--r-sm);
    color: var(--warn);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 10px;
    transition: background .15s;
  }
  .team-remove:active { background: rgba(184,64,52,.1); }

  .add-emp-row { display: flex; gap: 8px; margin-top: 16px; }
  .add-emp-row input {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 11px 12px;
    font-size: 13.5px;
    background: #fff;
    color: var(--ink);
    outline: none;
    transition: border-color .15s;
  }
  .add-emp-row input:focus { border-color: var(--accent); }
  .add-emp-row button {
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: var(--r-sm);
    padding: 0 18px;
    font-weight: 800;
    font-size: 13.5px;
    flex-shrink: 0;
    transition: opacity .15s;
  }
  .add-emp-row button:active { opacity: .8; }

  /* ── TOAST ───────────────────────────────────────────────────── */
  .toast {
    position: fixed;
    bottom: calc(80px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    white-space: nowrap;
    box-shadow: var(--shadow-md);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  /* ── PROGRESS BAR ────────────────────────────────────────────── */
  .progress-bar-wrap {
    height: 3px;
    background: var(--paper-deep);
    border-radius: 0;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
    transition: width .4s cubic-bezier(.4,0,.2,1);
  }

  /* ── EMPTY STATE ─────────────────────────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--ink-soft);
  }
  .empty-state-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state-msg  { font-size: 15px; font-weight: 700; margin: 0 0 6px; color: var(--ink); }
  .empty-state-sub  { font-size: 13px; margin: 0; }

  /* ── EXPORT ROOT ─────────────────────────────────────────────── */
  #exportRoot { position: fixed; left: -9999px; top: 0; }

  /* ── RESPONSIVE: iPad (768–1024px) ───────────────────────────── */
  @media (min-width: 768px) {
    .app { max-width: 860px; }

    .rail {
      padding-left: 28px;
      padding-right: 28px;
    }
    .rail-title { font-size: 20px; }
    .brand-icon { width: 42px; height: 42px; font-size: 22px; }
    .template-tabs { gap: 12px; }
    .template-tab { font-size: 14px; padding: 10px 8px; }

    .day-tabs-wrap { padding: 16px 24px 0; top: calc(env(safe-area-inset-top) + 118px); }
    .day-tab { font-size: 13.5px; padding: 11px 6px; }

    .board { padding: 4px 28px 120px; }
    .row-role { font-size: 15px; }
    .row-time { font-size: 12.5px; }
    .chip { font-size: 13.5px; padding: 9px 16px; }

    .emp-grid { grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .emp-btn-name { font-size: 14px; }

    .modal { max-width: 760px; }
    table.ov th { font-size: 11px; padding: 8px 6px; }
    table.ov td { font-size: 12px; padding: 8px 6px; }
    .pill-mini { font-size: 11px; padding: 4px 9px; }
    .stat-num { font-size: 26px; }
  }

  /* iPad Pro / large iPad landscape */
  @media (min-width: 1024px) {
    .app { max-width: 960px; }
    .emp-grid { grid-template-columns: repeat(4, 1fr); }
  }

  /* ── RESPONSIVE: small iPhone (≤375px) ──────────────────────── */
  @media (max-width: 375px) {
    .rail { padding-left: 14px; padding-right: 14px; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
/* ── DATA ─────────────────────────────────────────────────────── */
const DEFAULT_EMPLOYEES = [
  {id:'viji',      name:'Viji',      color:'#C8822A'},
  {id:'pratiksha', name:'Pratiksha', color:'#3D7A5A'},
  {id:'vinayak',   name:'Vinayak',   color:'#2E6090'},
  {id:'shreyas',   name:'Shreyas',   color:'#9A3E2A'},
  {id:'draksha',   name:'Draksha',   color:'#7A4A9A'},
  {id:'nandini',   name:'Nandini',   color:'#B04A78'},
  {id:'goli',      name:'Goli',      color:'#2E8880'},
  {id:'kishan',    name:'Kishan',    color:'#8A6E2A'},
  {id:'avinder',   name:'Avinder',   color:'#565690'},
  {id:'laxmi',     name:'Laxmi',     color:'#9A3050'},
];
const PALETTE = [
  '#C8822A','#3D7A5A','#2E6090','#9A3E2A','#7A4A9A',
  '#B04A78','#2E8880','#8A6E2A','#565690','#9A3050',
  '#4A6E9A','#6E9A3A'
];

function allTrue(days){ const o={}; days.forEach(d=>o[d]=true); return o; }

const TEMPLATES = {
  tueThu: {
    label: 'Tue – Thu',
    days:  ['Tuesday','Wednesday','Thursday'],
    groups: [
      {label: null, rows: [
        {role:'Morning Food Prep – Staff 1',      time:'10:30 am–3:30 pm'},
        {role:'Morning Food Prep – Staff 2',      time:'10:30 am–3:30 pm'},
        {role:'Dosa Maker',                        time:'5:00–10:00 pm'},
        {role:'Stove, Fryer & Tea/Coffee',         time:'5:00–10:00 pm'},
        {role:'Dishwasher',                        time:'6:30–10:30 pm'},
        {role:'Plating & Microwave',               time:'6:30–9:30 pm'},
        {role:'Front Staff',                       time:'6:30–9:30 pm'},
        {role:'Floor Cleaning',                    time:'10:30–11:30 pm'},
      ].map(r=>({...r, need:allTrue(['Tuesday','Wednesday','Thursday'])}))}
    ]
  },
  friSun: {
    label: 'Fri – Sun',
    days:  ['Friday','Saturday','Sunday'],
    groups: [
      {label: 'Morning', rows: [
        {role:'Morning Food Prep – Staff 1',       time:'8:30–10:00 am'},
        {role:'Morning Food Prep – Staff 2',       time:'8:30–10:00 am'},
        {role:'Morning Food Prep – Staff 3',       time:'9:00–10:00 am'},
        {role:'Dishwasher assisting Food Prep',    time:'9:00–10:00 am'},
        {role:'Front Staff – Primary',             time:'9:30 am–3:30 pm'},
        {role:'Dosa Maker',                        time:'10:00 am–3:00 pm'},
        {role:'Plating & Microwave',               time:'10:00 am–3:00 pm'},
        {role:'Stove, Fryer & Tea/Coffee',         time:'10:00 am–3:00 pm'},
        {role:'Refiller – Bain Marie',             time:'10:30 am–3:00 pm'},
        {role:'Dishwasher & Wipe',                 time:'11:00 am–5:00 pm'},
        {role:'Beverage / Ice Cream / Chaat',      time:'11:30 am–3:00 pm'},
        {role:'Front Staff – Additional',          time:'11:30 am–3:30 pm'},
        {role:'Front Staff – Runner',              time:'11:30 am–3:30 pm'},
        {role:'Meals Thali Plating',               time:'11:30 am–3:30 pm'},
        {role:'Overlap Front Cleaner',             time:'3:30–4:00 pm'},
        {role:'Overlap Back Cleaner',              time:'3:30–4:00 pm'},
        {role:'Overlap Bain Marie Refiller',       time:'3:30–5:30 pm'},
      ].map(r=>({...r, need:{Friday:false,Saturday:true,Sunday:true}}))},
      {label: 'Evening', rows: [
        {role:'Dosa Maker',                        time:'5:30–10:00 pm',  need:{Friday:true,Saturday:true,Sunday:true}},
        {role:'Front Staff – Primary',             time:'5:30–10:00 pm',  need:{Friday:true,Saturday:true,Sunday:true}},
        {role:'Plating & Microwave',               time:'5:30–10:00 pm',  need:{Friday:true,Saturday:true,Sunday:true}},
        {role:'Stove, Fryer & Tea/Coffee',         time:'5:30–10:00 pm',  need:{Friday:true,Saturday:true,Sunday:true}},
        {role:'Dishwasher & Wipe',                 time:'6:00–10:30 pm',  need:{Friday:true,Saturday:true,Sunday:true}},
        {role:'Beverage / Ice Cream / Chaat',      time:'6:30–9:30 pm',   need:{Friday:false,Saturday:true,Sunday:false}},
        {role:'Front Staff – Additional',          time:'6:30–9:30 pm',   need:{Friday:false,Saturday:true,Sunday:false}},
        {role:'Front Staff – Runner + Beverage',   time:'6:30–9:30 pm',   need:{Friday:true,Saturday:false,Sunday:true}},
        {role:'Refiller – Bain Marie',             time:'6:30–10:00 pm',  need:{Friday:true,Saturday:true,Sunday:true}},
        {role:'Floor Cleaning',                    time:'10:30–11:30 pm', need:{Friday:true,Saturday:true,Sunday:true}},
      ]}
    ]
  }
};

/* ── STATE ────────────────────────────────────────────────────── */
let employees  = DEFAULT_EMPLOYEES.slice();
let assignments = {};
let weekLabels  = {};
let state = { template:'friSun', day:null, sheetKey:null };

/* ── STORAGE ──────────────────────────────────────────────────── */
const LS = {
  get(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } },
  set(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }
};
function loadData(){
  const emp = LS.get('thlv:employees');
  if(emp) try{ employees = JSON.parse(emp); }catch(e){}
  const asgn = LS.get('thlv:assignments');
  if(asgn) try{ assignments = JSON.parse(asgn); }catch(e){}
  const wl = LS.get('thlv:weekLabels');
  if(wl) try{ weekLabels = JSON.parse(wl); }catch(e){}
}
function saveEmployees()  { LS.set('thlv:employees', JSON.stringify(employees)); }
function saveAssignments(){ LS.set('thlv:assignments', JSON.stringify(assignments)); }
function saveWeekLabels() { LS.set('thlv:weekLabels', JSON.stringify(weekLabels)); }

/* ── HELPERS ──────────────────────────────────────────────────── */
function empById(id){ return employees.find(e=>e.id===id); }
function initials(name){ return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function slotKey(tplKey, day, gi, ri){ return `${tplKey}|${day}|${gi}|${ri}`; }

function parseTimeRange(str){
  const m = str.match(/(\d{1,2}:\d{2})\s*(am|pm)?\s*[–\-]\s*(\d{1,2}:\d{2})\s*(am|pm)?/i);
  if(!m) return null;
  let [_, t1, mer1, t2, mer2] = m;
  if(!mer1 && mer2) mer1 = mer2;
  if(!mer2 && mer1) mer2 = mer1;
  if(!mer1) mer1 = 'am';
  if(!mer2) mer2 = 'am';
  function toMin(t, mer){
    let [h,mi] = t.split(':').map(Number);
    h = h % 12;
    if(mer.toLowerCase()==='pm') h += 12;
    return h*60+mi;
  }
  let start = toMin(t1, mer1);
  let end   = toMin(t2, mer2);
  if(end <= start) end += 24*60;
  return {start, end};
}

function findConflict(tplKey, day, empId, excludeKey, myRange){
  if(!myRange) return false;
  const tpl = TEMPLATES[tplKey];
  for(let gi=0; gi<tpl.groups.length; gi++){
    const g = tpl.groups[gi];
    for(let ri=0; ri<g.rows.length; ri++){
      const row = g.rows[ri];
      if(!row.need[day]) continue;
      const key = slotKey(tplKey, day, gi, ri);
      if(key===excludeKey) continue;
      if(assignments[key] !== empId) continue;
      const r2 = parseTimeRange(row.time);
      if(!r2) continue;
      if(myRange.start < r2.end && r2.start < myRange.end) return true;
    }
  }
  return false;
}

/* Total required slots for a template+day */
function countRequired(tplKey, day){
  const tpl = TEMPLATES[tplKey];
  let req=0, filled=0;
  tpl.groups.forEach((g,gi)=>{
    g.rows.forEach((row,ri)=>{
      if(!row.need[day]) return;
      req++;
      if(assignments[slotKey(tplKey, day, gi, ri)]) filled++;
    });
  });
  return {req, filled};
}

/* How many shifts an employee has across current template */
function empShiftCount(empId, tplKey){
  const tpl = TEMPLATES[tplKey];
  let count=0;
  tpl.days.forEach(d=>{
    tpl.groups.forEach((g,gi)=>{
      g.rows.forEach((row,ri)=>{
        if(!row.need[d]) return;
        if(assignments[slotKey(tplKey,d,gi,ri)]===empId) count++;
      });
    });
  });
  return count;
}

/* ── RENDER TEMPLATE TABS ─────────────────────────────────────── */
function renderTemplateTabs(){
  const el = document.getElementById('templateTabs');
  el.innerHTML = '';
  Object.keys(TEMPLATES).forEach(key=>{
    const b = document.createElement('button');
    b.className = 'template-tab' + (state.template===key ? ' active':'');
    b.textContent = TEMPLATES[key].label;
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected', state.template===key ? 'true':'false');
    b.onclick = ()=>{ state.template=key; state.day=TEMPLATES[key].days[0]; renderAll(); };
    el.appendChild(b);
  });
}

/* ── RENDER DAY TABS ──────────────────────────────────────────── */
function renderDayTabs(){
  const tpl = TEMPLATES[state.template];
  if(!state.day || !tpl.days.includes(state.day)) state.day = tpl.days[0];
  const el = document.getElementById('dayTabs');
  el.innerHTML = '';
  tpl.days.forEach(d=>{
    const {req,filled} = countRequired(state.template, d);
    const pct = req ? Math.round(filled/req*100) : 0;
    const b = document.createElement('button');
    b.className = 'day-tab' + (state.day===d ? ' active':'');
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected', state.day===d ? 'true':'false');
    // Short name for small screens, full for larger
    const shortDay = d.slice(0,3);
    b.innerHTML = `${shortDay}<span class="day-count">${filled}/${req}</span>`;
    b.setAttribute('aria-label', `${d} – ${filled} of ${req} filled`);
    b.onclick = ()=>{ state.day=d; renderAll(); };
    el.appendChild(b);
  });
}

/* ── RENDER PROGRESS BAR ──────────────────────────────────────── */
function renderProgressBar(){
  const tpl = TEMPLATES[state.template];
  let req=0, filled=0;
  tpl.days.forEach(d=>{
    const c = countRequired(state.template, d);
    req += c.req; filled += c.filled;
  });
  const pct = req ? Math.round(filled/req*100) : 0;
  document.getElementById('progressBar').style.width = pct+'%';
}

/* ── RENDER BOARD ─────────────────────────────────────────────── */
function renderBoard(){
  const tpl = TEMPLATES[state.template];
  const el  = document.getElementById('board');
  el.innerHTML = '';

  const {req, filled} = countRequired(state.template, state.day);

  if(req === 0){
    el.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">📅</div>
      <p class="empty-state-msg">No shifts for ${state.day}</p>
      <p class="empty-state-sub">Select another day or template</p>
    </div>`;
    return;
  }

  tpl.groups.forEach((g, gi)=>{
    if(g.label){
      const lab = document.createElement('div');
      lab.className = 'group-label';
      lab.textContent = g.label;
      el.appendChild(lab);
    }
    g.rows.forEach((row, ri)=>{
      const key = slotKey(state.template, state.day, gi, ri);
      const wrap = document.createElement('div');
      wrap.className = 'row';

      const info = document.createElement('div');
      info.className = 'row-info';
      info.innerHTML = `<p class="row-role">${row.role}</p><p class="row-time mono">${row.time}</p>`;
      wrap.appendChild(info);

      if(!row.need[state.day]){
        const chip = document.createElement('span');
        chip.className = 'chip chip-off';
        chip.textContent = 'Not required';
        wrap.appendChild(chip);
      } else {
        const empId = assignments[key];
        const chip  = document.createElement('button');
        if(empId && empById(empId)){
          const emp = empById(empId);
          chip.className = 'chip chip-name';
          chip.style.background = emp.color;
          chip.innerHTML = `${emp.name} <span class="chip-x" aria-hidden="true">×</span>`;
          chip.setAttribute('aria-label', `${emp.name} assigned to ${row.role} – tap to change`);
          chip.onclick = ()=> openSheet(gi, ri, key, true);
        } else {
          chip.className = 'chip chip-empty';
          chip.textContent = '+ Assign';
          chip.setAttribute('aria-label', `Assign someone to ${row.role}`);
          chip.onclick = ()=> openSheet(gi, ri, key, false);
        }
        wrap.appendChild(chip);
      }
      el.appendChild(wrap);
    });
  });
}

/* ── RENDER ALL ───────────────────────────────────────────────── */
function renderAll(){
  renderTemplateTabs();
  renderDayTabs();
  renderProgressBar();
  renderBoard();
}

/* ── ASSIGN SHEET ─────────────────────────────────────────────── */
function openSheet(gi, ri, key, isAssigned){
  const tpl = TEMPLATES[state.template];
  const row = tpl.groups[gi].rows[ri];
  state.sheetKey = key;
  document.getElementById('sheetTitle').textContent = row.role;
  document.getElementById('sheetSub').textContent   = `${row.time} · ${state.day}`;
  const myRange = parseTimeRange(row.time);
  const grid    = document.getElementById('empGrid');
  grid.innerHTML = '';
  employees.forEach(emp=>{
    const btn      = document.createElement('button');
    const selected = assignments[key] === emp.id;
    const conflict = findConflict(state.template, state.day, emp.id, key, myRange);
    btn.className  = 'emp-btn' + (selected ? ' selected':'');
    btn.innerHTML  = `<span class="emp-dot" style="background:${emp.color}">${initials(emp.name)}</span>
      <span class="emp-btn-name">${emp.name}</span>` +
      (conflict ? '<span class="conflict-dot" title="Scheduling conflict" aria-label="Scheduling conflict"></span>' : '');
    btn.setAttribute('aria-pressed', selected ? 'true':'false');
    btn.setAttribute('aria-label', emp.name + (conflict?' (has a conflict)':'') + (selected?' – currently assigned':''));
    btn.onclick = ()=>{
      assignments[key] = emp.id;
      saveAssignments();
      closeSheet();
      renderAll();
      showToast(`✓ ${emp.name} assigned`);
    };
    grid.appendChild(btn);
  });
  const anyConflict = employees.some(e=>findConflict(state.template, state.day, e.id, key, myRange));
  document.getElementById('conflictNote').classList.toggle('show', anyConflict);
  document.getElementById('sheetClearBtn').style.display = isAssigned ? 'block':'none';
  document.getElementById('sheetOverlay').classList.add('show');
  // Focus first button
  setTimeout(()=>{ const first = grid.querySelector('button'); if(first) first.focus(); }, 50);
}
function closeSheet(){ document.getElementById('sheetOverlay').classList.remove('show'); }
function clearCurrentSlot(){
  if(state.sheetKey){ delete assignments[state.sheetKey]; saveAssignments(); }
  closeSheet();
  renderAll();
  showToast('Slot cleared');
}

/* ── TOAST ────────────────────────────────────────────────────── */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 1600);
}

/* ── OVERVIEW ─────────────────────────────────────────────────── */
function loadWeekLabelInput(){
  document.getElementById('weekLabelInput').value = weekLabels[state.template] || '';
}
function saveWeekLabel(){
  weekLabels[state.template] = document.getElementById('weekLabelInput').value;
  saveWeekLabels();
  renderOverviewTable();
}

function openOverview(){
  loadWeekLabelInput();
  renderStats();
  renderOverviewTable();
  renderLegend();
  document.getElementById('overviewOverlay').classList.add('show');
}
function closeOverview(){ document.getElementById('overviewOverlay').classList.remove('show'); }

function renderStats(){
  const tpl = TEMPLATES[state.template];
  let totalReq=0, totalFilled=0, totalStaff=new Set();
  tpl.days.forEach(d=>{
    tpl.groups.forEach((g,gi)=>{
      g.rows.forEach((row,ri)=>{
        if(!row.need[d]) return;
        totalReq++;
        const id = assignments[slotKey(state.template,d,gi,ri)];
        if(id){ totalFilled++; totalStaff.add(id); }
      });
    });
  });
  const pct = totalReq ? Math.round(totalFilled/totalReq*100) : 0;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-num">${totalFilled}</div><div class="stat-lbl">Assigned</div></div>
    <div class="stat-card"><div class="stat-num">${totalReq-totalFilled}</div><div class="stat-lbl">Unfilled</div></div>
    <div class="stat-card"><div class="stat-num">${totalStaff.size}</div><div class="stat-lbl">Staff on</div></div>
    <div class="stat-card"><div class="stat-num">${pct}%</div><div class="stat-lbl">Complete</div></div>`;
}

function buildOverviewTableEl(){
  const tpl   = TEMPLATES[state.template];
  const table = document.createElement('table');
  table.className = 'ov';
  const thead = document.createElement('thead');
  const trh   = document.createElement('tr');
  trh.innerHTML = `<th>Role</th>` + tpl.days.map(d=>`<th class="day-col">${d.slice(0,3)}</th>`).join('');
  thead.appendChild(trh);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  tpl.groups.forEach((g, gi)=>{
    if(g.label){
      const tr = document.createElement('tr');
      tr.innerHTML = `<td colspan="${tpl.days.length+1}" style="font-weight:800;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-soft);padding-top:12px;border-bottom:none;">${g.label}</td>`;
      tbody.appendChild(tr);
    }
    g.rows.forEach((row, ri)=>{
      const tr = document.createElement('tr');
      let cells = `<td class="role-cell">${row.role}<span class="role-time mono">${row.time}</span></td>`;
      tpl.days.forEach(d=>{
        const key = slotKey(state.template, d, gi, ri);
        if(!row.need[d]){
          cells += `<td class="day-cell dash">—</td>`;
        } else {
          const emp = assignments[key] ? empById(assignments[key]) : null;
          cells += `<td class="day-cell">` +
            (emp
              ? `<span class="pill-mini" style="background:${emp.color}">${initials(emp.name)}</span>`
              : `<span class="dash">·</span>`) +
            `</td>`;
        }
      });
      tr.innerHTML = cells;
      tbody.appendChild(tr);
    });
  });
  table.appendChild(tbody);
  return table;
}

function renderOverviewTable(){
  const wrap = document.getElementById('overviewTableWrap');
  wrap.innerHTML = '';
  wrap.appendChild(buildOverviewTableEl());
}

function renderLegend(){
  const el = document.getElementById('legend');
  el.innerHTML = '';
  employees.forEach(e=>{
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${e.color}"></span>${e.name}`;
    el.appendChild(item);
  });
}

function resetWeek(){
  if(!confirm('Clear all assignments for this roster? This cannot be undone.')) return;
  const tpl = TEMPLATES[state.template];
  tpl.days.forEach(d=>{
    tpl.groups.forEach((g,gi)=>{
      g.rows.forEach((_,ri)=>{ delete assignments[slotKey(state.template,d,gi,ri)]; });
    });
  });
  saveAssignments();
  renderAll();
  renderOverviewTable();
  renderStats();
  showToast('Roster cleared');
}

/* ── DOWNLOAD IMAGE ───────────────────────────────────────────── */
async function downloadImage(){
  const tpl   = TEMPLATES[state.template];
  const label = weekLabels[state.template] || tpl.label;
  const root  = document.getElementById('exportRoot');
  root.innerHTML = '';

  const card = document.createElement('div');
  card.style.cssText = 'width:1280px;background:#FBF6EC;padding:48px 56px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#1E1A14;';

  // Header
  const header = document.createElement('div');
  header.style.cssText = 'display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1E1A14;padding-bottom:18px;margin-bottom:28px;';
  header.innerHTML = `
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#F0A940,#C8962A);display:flex;align-items:center;justify-content:center;font-size:28px;">🍛</div>
      <div>
        <div style="font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#C8822A;margin-bottom:2px;">Thalaivaa's</div>
        <div style="font-size:28px;font-weight:800;line-height:1.1;">Weekly Roster</div>
        <div style="font-size:14px;color:#7A6F5E;margin-top:3px;">${label}</div>
      </div>
    </div>
    <div style="font-size:12px;color:#B8AE99;text-align:right;">
      ${tpl.label}<br>Generated ${new Date().toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
    </div>`;
  card.appendChild(header);

  // Stats strip
  let totalReq=0, totalFilled=0;
  tpl.days.forEach(d=>{ const c=countRequired(state.template,d); totalReq+=c.req; totalFilled+=c.filled; });
  const statsStrip = document.createElement('div');
  statsStrip.style.cssText = 'display:flex;gap:16px;margin-bottom:28px;';
  [['Shifts assigned', totalFilled], ['Unfilled', totalReq-totalFilled], ['Total slots', totalReq]].forEach(([lbl,val])=>{
    statsStrip.innerHTML += `<div style="background:#F0E8D4;border-radius:10px;padding:12px 20px;">
      <div style="font-size:22px;font-weight:800;color:#C8822A;">${val}</div>
      <div style="font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#7A6F5E;margin-top:2px;">${lbl}</div>
    </div>`;
  });
  card.appendChild(statsStrip);

  // Table
  const table = document.createElement('table');
  table.style.cssText = 'width:100%;border-collapse:collapse;';
  let thRow = '<tr>';
  thRow += `<th style="text-align:left;padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#7A6F5E;border-bottom:2px solid #1E1A14;">Role &amp; Time</th>`;
  tpl.days.forEach(d=> thRow += `<th style="text-align:center;padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#7A6F5E;border-bottom:2px solid #1E1A14;">${d}</th>`);
  thRow += '</tr>';
  const thead = document.createElement('thead');
  thead.innerHTML = thRow;
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  tpl.groups.forEach((g, gi)=>{
    if(g.label){
      const tr = document.createElement('tr');
      tr.innerHTML = `<td colspan="${tpl.days.length+1}" style="padding:16px 12px 4px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#7A6F5E;border-bottom:none;">${g.label}</td>`;
      tbody.appendChild(tr);
    }
    g.rows.forEach((row, ri)=>{
      const tr = document.createElement('tr');
      const bg = (gi+ri) % 2 === 0 ? '#FBF6EC' : '#F7F0E0';
      let cells = `<td style="padding:9px 12px;border-bottom:1px solid #DDD3BA;background:${bg};">
        <div style="font-weight:700;font-size:13.5px;">${row.role}</div>
        <div style="font-size:11px;color:#7A6F5E;font-family:ui-monospace,Menlo,monospace;margin-top:2px;">${row.time}</div></td>`;
      tpl.days.forEach(d=>{
        const key = slotKey(state.template, d, gi, ri);
        if(!row.need[d]){
          cells += `<td style="text-align:center;padding:9px 12px;border-bottom:1px solid #DDD3BA;background:${bg};color:#B8AE99;">—</td>`;
        } else {
          const emp = assignments[key] ? empById(assignments[key]) : null;
          if(emp){
            cells += `<td style="text-align:center;padding:9px 12px;border-bottom:1px solid #DDD3BA;background:${bg};">
              <span style="display:inline-block;background:${emp.color};color:#fff;padding:5px 14px;border-radius:14px;font-size:12px;font-weight:700;">${emp.name}</span></td>`;
          } else {
            cells += `<td style="text-align:center;padding:9px 12px;border-bottom:1px solid #DDD3BA;background:${bg};color:#B8AE99;font-size:12px;">unfilled</td>`;
          }
        }
      });
      tr.innerHTML = cells;
      tbody.appendChild(tr);
    });
  });
  table.appendChild(tbody);
  card.appendChild(table);

  // Legend
  const legWrap = document.createElement('div');
  legWrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;padding-top:16px;border-top:1px solid #DDD3BA;';
  employees.forEach(e=>{
    legWrap.innerHTML += `<div style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:#7A6F5E;">
      <span style="width:10px;height:10px;border-radius:50%;background:${e.color};display:inline-block;"></span>${e.name}</div>`;
  });
  card.appendChild(legWrap);

  // Footer
  const footer = document.createElement('div');
  footer.style.cssText = 'margin-top:14px;font-size:10.5px;color:#B8AE99;';
  footer.textContent = `Thalaivaa's · Generated by the Weekly Roster tool`;
  card.appendChild(footer);

  root.appendChild(card);
  try{
    const canvas = await html2canvas(card, {backgroundColor:'#FBF6EC', scale:2, useCORS:true});
    const link   = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0,10);
    link.download = `thlv-roster-${state.template}-${dateStr}.png`;
    link.href     = canvas.toDataURL('image/png');
    link.click();
    showToast('✓ Image downloaded');
  }catch(e){
    showToast('Could not generate image');
    console.error(e);
  }
  root.innerHTML = '';
}

/* ── TEAM PANEL ───────────────────────────────────────────────── */
function openTeam(){ renderTeamList(); document.getElementById('teamOverlay').classList.add('show'); }
function closeTeam(){ document.getElementById('teamOverlay').classList.remove('show'); }

function renderTeamList(){
  const el = document.getElementById('teamList');
  el.innerHTML = '';
  if(employees.length === 0){
    el.innerHTML = '<p style="text-align:center;color:var(--ink-soft);font-size:13px;padding:20px 0;">No team members yet.</p>';
    return;
  }
  employees.forEach(emp=>{
    const shifts = empShiftCount(emp.id, state.template);
    const row    = document.createElement('div');
    row.className = 'team-row';
    row.innerHTML = `
      <span class="emp-dot" style="background:${emp.color}">${initials(emp.name)}</span>
      <span class="team-row-name">${emp.name}</span>
      <span class="team-row-shifts">${shifts} shift${shifts!==1?'s':''}</span>
      <button class="team-remove" aria-label="Remove ${emp.name}">Remove</button>`;
    row.querySelector('.team-remove').onclick = ()=> removeEmployee(emp.id);
    el.appendChild(row);
  });
}

function removeEmployee(id){
  if(!confirm(`Remove ${empById(id)?.name} from the team?`)) return;
  employees = employees.filter(e=>e.id!==id);
  saveEmployees();
  Object.keys(assignments).forEach(k=>{ if(assignments[k]===id) delete assignments[k]; });
  saveAssignments();
  renderTeamList();
  renderAll();
  showToast('Team member removed');
}

function addEmployee(){
  const input = document.getElementById('newEmpName');
  const name  = input.value.trim();
  if(!name){ input.focus(); return; }
  // Check duplicate
  if(employees.some(e=>e.name.toLowerCase()===name.toLowerCase())){
    showToast('Name already exists');
    return;
  }
  const id    = name.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + Date.now().toString(36);
  const color = PALETTE[employees.length % PALETTE.length];
  employees.push({id, name, color});
  saveEmployees();
  input.value = '';
  input.focus();
  renderTeamList();
  renderAll();
  showToast(`✓ ${name} added`);
}

/* ── KEYBOARD SHORTCUTS ───────────────────────────────────────── */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    closeSheet();
    closeOverview();
    closeTeam();
  }
  // Arrow keys to switch days when no modal open
  const noModal = !document.getElementById('sheetOverlay').classList.contains('show') &&
                  !document.getElementById('overviewOverlay').classList.contains('show') &&
                  !document.getElementById('teamOverlay').classList.contains('show');
  if(noModal){
    const tpl  = TEMPLATES[state.template];
    const idx  = tpl.days.indexOf(state.day);
    if(e.key==='ArrowRight' && idx < tpl.days.length-1){ state.day=tpl.days[idx+1]; renderAll(); }
    if(e.key==='ArrowLeft'  && idx > 0)                { state.day=tpl.days[idx-1]; renderAll(); }
  }
});

/* ── SWIPE TO CHANGE DAY ──────────────────────────────────────── */
(function initSwipe(){
  let startX=0, startY=0;
  const el = document.getElementById('board');
  el.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; startY=e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)*0.8) return;
    const tpl = TEMPLATES[state.template];
    const idx = tpl.days.indexOf(state.day);
    if(dx < 0 && idx < tpl.days.length-1){ state.day=tpl.days[idx+1]; renderAll(); }
    if(dx > 0 && idx > 0)                { state.day=tpl.days[idx-1]; renderAll(); }
  }, {passive:true});
})();

/* ── INIT ─────────────────────────────────────────────────────── */
(function init(){
  loadData();
  state.day = TEMPLATES[state.template].days[0];
  renderAll();
})();
</script>
